<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiszki — JARVIS</title>
<style>body{font:17px system-ui;background:#071821;color:#e0f5ff;max-width:850px;margin:auto;padding:24px}a{color:#7de9ff}h1{margin-bottom:8px}form,article{background:#102d3b;padding:20px;border-radius:12px;margin:18px 0}label{display:block;margin:10px 0}textarea{box-sizing:border-box;width:100%;font:inherit;background:#071821;color:inherit;border:1px solid #58747e;border-radius:6px;padding:10px}button{font:inherit;cursor:pointer;padding:8px 14px;margin:6px 6px 0 0;border:0;border-radius:6px;background:#8de7fa;color:#071821}button:disabled{opacity:.5}article p{white-space:pre-wrap;overflow-wrap:anywhere}.muted{font-size:14px;color:#acc5cf}#notice{min-height:24px}</style></head>
<body><a href="/">← Panel JARVIS</a><h1>Twoje fiszki</h1><p>Popraw pytanie lub odpowiedź. Po zmianie fiszka wróci do powtórki.</p>
<form id="editor"><h2 id="title">Dodaj fiszkę</h2><label>Pytanie<textarea id="question" required maxlength="1000" rows="2"></textarea></label><label>Odpowiedź<textarea id="answer" required maxlength="4000" rows="3"></textarea></label><button id="save">Zapisz</button><button type="button" id="cancel">Anuluj edycję</button></form>
<p id="notice" role="status" aria-live="polite"></p><div id="cards"></div>
<script>
let editing=null,busy=false;
const byId=id=>document.getElementById(id);
function notice(text){byId('notice').textContent=text}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{'Content-Type':'application/json'}});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Nie udało się wykonać operacji.');return data}
function clear(){editing=null;byId('editor').reset();byId('title').textContent='Dodaj fiszkę'}
function button(text,action){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=action;return b}
async function refresh(){const data=await api('/api/flashcards');const list=byId('cards');list.replaceChildren();if(!data.cards.length){list.textContent='Nie masz jeszcze fiszek. Dodaj pierwszą powyżej.';return}for(const card of data.cards){const item=document.createElement('article');const q=document.createElement('h2');q.textContent=card.question;const a=document.createElement('p');a.textContent=card.answer;const meta=document.createElement('p');meta.className='muted';meta.textContent=`Powtórki: ${card.reviews} · Termin: ${new Date(card.due_at).toLocaleString('pl-PL')}`;item.append(q,a,meta,button('Edytuj',()=>{if(busy)return;editing=card.id;byId('question').value=card.question;byId('answer').value=card.answer;byId('title').textContent='Edytuj fiszkę';byId('question').focus();byId('editor').scrollIntoView({behavior:'smooth'})}),button('Usuń',async()=>{if(busy||!confirm('Usunąć tę fiszkę i jej postęp?'))return;busy=true;try{await api('/api/flashcards/'+card.id,{method:'DELETE'});if(editing===card.id)clear();await refresh();notice('Fiszka usunięta.')}catch(e){notice(e.message)}finally{busy=false}}));list.append(item)}}
byId('cancel').onclick=()=>{if(!busy)clear()};
byId('editor').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;byId('save').disabled=true;try{const question=byId('question').value.trim(),answer=byId('answer').value.trim();if(!question||!answer)throw Error('Wpisz pytanie i odpowiedź.');await api('/api/flashcards'+(editing===null?'':'/'+editing),{method:editing===null?'POST':'PUT',body:JSON.stringify({question,answer})});clear();await refresh();notice('Fiszka zapisana.')}catch(e){notice(e.message)}finally{busy=false;byId('save').disabled=false}};
refresh().catch(e=>notice(e.message));
</script></body></html>
