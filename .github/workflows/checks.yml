name: JARVIS checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             python-dotenv             requests             icalendar             recurring-ical-events             psutil             fastapi             httpx             gtfs-realtime-bindings             numpy             pandas

      - name: Compile Python sources
        run: |
          python -m compileall -q             main.py             jarvis_gui.py             skills             tools             tests

      - name: Unit tests
        run: |
          python -m unittest discover -v tests

  study-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser test dependencies
        run: |
          npm install --prefix /tmp/jarvis-ui-runtime --no-save --ignore-scripts playwright@1.51.1
          node /tmp/jarvis-ui-runtime/node_modules/playwright/cli.js install --with-deps chromium --only-shell
      - name: Tutoring panel regression
        env:
          NODE_PATH: /tmp/jarvis-ui-runtime/node_modules
        run: node tests/study_ui.cjs
